name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-go:
    uses: juli3nk/ci-shared/.github/workflows/go-lint.yaml@main
    with:
      go_version: ${{ vars.GO_VERSION }}

  deps:
    uses: juli3nk/ci-shared/.github/workflows/go-deps.yaml@main
    with:
      go_version: ${{ vars.GO_VERSION }}
      check_licenses: false

  release:
    needs: build
    permissions:
      contents: write
    uses: juli3nk/ci-shared/.github/workflows/release.yaml@main
